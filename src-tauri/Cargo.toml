[package]
name = "helmose"
version = "0.1.0"
description = "Helmose - AI 驱动的人生知识库"
authors = ["yuanruiqin"]
edition = "2021"
default-run = "helmose"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# devtools:Tauri v2 在 debug 构建自动启用(cfg(debug_assertions));release 不带此 feature,
# 防 webview 右键 Inspect 暴露用户数据(笔记/AI 输入)。开发期 tauri:dev 仍有 devtools。
tauri = { version = "2.0" }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.5.3"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Vault 数据层
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2.5"
gray_matter = "0.2"
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# 错误处理与日志
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# M4：AI 教练层（LLM HTTP 调用 + 异步 trait）
# reqwest 走 tokio runtime；async_trait 给 AiClient trait 用（dyn-safe）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"

# B4：密钥存储（api_key 挪到系统钥匙串，Mac Keychain / Win Credential Manager / Linux Secret Service）
# v3 Entry::new 返回 Result（非 v2 直接 Entry）；显式选三平台 native backend，否则无默认 store
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
